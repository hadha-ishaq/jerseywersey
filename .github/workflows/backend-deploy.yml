name: Deploy Medusa Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Medusa
        run: npm run build --workspace=@dtc/backend

      - name: Install production dependencies
        working-directory: apps/backend/.medusa/server
        run: npm install --omit=dev

      - name: Prepare deployment archive
        run: |
          tar -czf backend.tar.gz \
            -C apps/backend/.medusa/server .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY_FINAL }}

      - name: Upload backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "backend.tar.gz"
          target: "~/jerseywersey-backend"

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            cd ~/jerseywersey-backend

            rm -rf current
            mkdir -p current

            tar -xzf backend.tar.gz -C current
            rm backend.tar.gz

            cd current

            npm install --omit=dev

            mkdir -p tmp
            touch tmp/restart.txt