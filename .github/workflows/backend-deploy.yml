name: Deploy Medusa Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build --workspace=@dtc/backend

      - name: Deploy backend to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "apps/backend/*,package.json,package-lock.json"
          target: "~/jerseywersey-backend"
          overwrite: true
          strip_components: 0