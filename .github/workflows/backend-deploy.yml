name: Deploy Medusa Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Medusa
        run: npm run build --workspace=@dtc/backend

      - name: Install production dependencies
        working-directory: apps/backend/.medusa/server
        run: npm install --omit=dev

      - name: Prepare deployment archive
        run: |
          tar -czf backend.tar.gz \
            -C apps/backend/.medusa/server .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Upload backend
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -P "${{ secrets.CPANEL_PORT }}" \
            backend.tar.gz \
            "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:~/jerseywersey-backend/"

            - name: Deploy and restart
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}" << 'EOF'

          cd ~/jerseywersey-backend

          rm -rf .deploy
          mkdir -p .deploy

          tar -xzf backend.tar.gz -C .deploy
          rm backend.tar.gz

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".deploy" \
            ! -name ".env" \
            -exec rm -rf {} +

          cp -a .deploy/. .
          rm -rf .deploy

          npm install --omit=dev

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Deployment completed successfully."

          EOF
